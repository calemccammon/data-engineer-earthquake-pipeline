version: 2

models:
  - name: int_earthquakes_classified
    description: >
      Extends stg_earthquakes with derived classification columns:
      magnitude_class (minor/light/moderate/strong/major/great),
      depth_class (shallow/intermediate/deep, or unknown when USGS gives no depth), region extracted from the USGS
      place string, and convenience date/hour truncation columns.
    columns:
      - name: id
        description: "Unique USGS earthquake identifier."
        tests:
          - not_null
          - unique
      - name: magnitude_class
        description: "Magnitude class: minor (below 4.0), light, moderate, strong, major, great (8.0 and above)."
        tests:
          - not_null
          - accepted_values:
              values: ['minor', 'light', 'moderate', 'strong', 'major', 'great']
      - name: depth_class
        description: "Focal depth classification bucket."
        tests:
          - not_null
          - accepted_values:
              values: ['shallow', 'intermediate', 'deep', 'unknown']
      - name: region
        description: "Text after the last comma of the USGS place string, or 'Unknown' when place is missing."
        tests:
          - not_null
      - name: occurred_date
        description: "Event date truncated to day (UTC)."
        tests:
          - not_null
      - name: occurred_hour
        description: "Hour of day (0–23, UTC)."
        tests:
          - not_null
