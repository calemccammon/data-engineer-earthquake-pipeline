<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Earthquake Pipeline — dbt Docs</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }
    .card {
      text-align: center;
      padding: 2rem 3rem;
      background: white;

    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    p  { color: #666; margin-bottom: 1.5rem; }
    a  {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: #ff694b;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
    }
    a:hover { background: #e0512e; }
  </style>
</head>
<body>
  <!--
    GitHub Pages serves this file as the landing page.
    The actual dbt docs site (index.html with embedded JS) is deployed

  -->
  <div class="card">
    <h1>🌍 Earthquake Pipeline</h1>
    <p>dbt documentation is generated and deployed automatically on each push to <code>main</code>.</p>
