name: dbt Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dbt-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: earthquake_dw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: earthquake_dw
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DBT_PROFILES_DIR: earthquake_dbt

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-airflow.txt

      - name: Install dbt and dependencies
        run: pip install dbt-postgres psycopg2-binary requests pytest

      - name: Run Python unit tests
        run: pytest tests/ -v

      - name: Create raw schema and earthquakes table
        run: psql -h localhost -U postgres -d earthquake_dw -f scripts/init_ci.sql
        env:
          PGPASSWORD: postgres

      - name: Load test seed data
        run: psql -h localhost -U postgres -d earthquake_dw -f scripts/seed_test_data.sql
        env:
          PGPASSWORD: postgres

      - name: dbt deps
        run: dbt deps --profiles-dir earthquake_dbt
        working-directory: earthquake_dbt

      - name: dbt run
        run: dbt run --profiles-dir ../earthquake_dbt --target dev
        working-directory: earthquake_dbt

      - name: dbt test
        run: dbt test --profiles-dir ../earthquake_dbt --target dev
        working-directory: earthquake_dbt
