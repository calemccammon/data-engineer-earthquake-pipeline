name: Deploy dbt Docs

on:
  push:
    branches: [main]
    paths:
      - 'earthquake_dbt/**'
      - '.github/workflows/dbt-docs.yml'

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: earthquake_dw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: earthquake_dw
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DBT_PROFILES_DIR: earthquake_dbt

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-airflow.txt

      - name: Install dbt
        run: pip install dbt-postgres psycopg2-binary

      - name: Create raw schema and earthquakes table
        run: psql -h localhost -U postgres -d earthquake_dw -f scripts/init_ci.sql
        env:
          PGPASSWORD: postgres

      - name: Load test seed data
        run: psql -h localhost -U postgres -d earthquake_dw -f scripts/seed_test_data.sql
        env:
          PGPASSWORD: postgres

      - name: dbt deps
        run: dbt deps
        working-directory: earthquake_dbt

      - name: dbt run (needed for catalog generation)
        run: dbt run --profiles-dir ../earthquake_dbt --target dev
        working-directory: earthquake_dbt

      - name: dbt docs generate
        run: dbt docs generate --profiles-dir ../earthquake_dbt --target dev
        working-directory: earthquake_dbt

      - name: Copy dbt docs to docs/ folder
        run: |
          mkdir -p docs
          cp earthquake_dbt/target/index.html docs/index.html
          cp earthquake_dbt/target/manifest.json docs/manifest.json
          cp earthquake_dbt/target/catalog.json docs/catalog.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload docs as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
